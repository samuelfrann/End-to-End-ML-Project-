<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FraudGuard | Insurance Claim Analysis</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .loader { border-top-color: #3498db; animation: spinner 1.5s linear infinite; }
        @keyframes spinner { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="bg-slate-50 text-slate-800">

    <div class="max-w-4xl mx-auto my-10 px-4">
        <div class="text-center mb-10">
            <a href="index.html" class="text-blue-500 text-sm hover:underline">&larr; Back to Home</a>
            <h1 class="text-3xl font-bold text-blue-900 mt-2">Insurance Auto Claim Fraud Detection</h1>
            <p class="text-slate-500 mt-2">Professional Grade ML Analysis for Claim Integrity</p>
        </div>

        <div class="bg-white shadow-xl rounded-2xl p-8 border border-slate-100">
            <form id="fraudForm">
                <h2 class="text-xl font-semibold mb-6 text-slate-700 border-b pb-2">Policy & Incident Details</h2>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div class="flex flex-col">
                        <label class="text-sm font-medium mb-1">Policy Number</label>
                        <input type="text" name="policy_number" required class="border rounded-lg p-2.5 focus:ring-2 focus:ring-blue-500 outline-none transition">
                    </div>

                    <div class="flex flex-col">
                        <label class="text-sm font-medium mb-1">Policy Holder Age</label>
                        <input type="number" name="age" required class="border rounded-lg p-2.5 focus:ring-2 focus:ring-blue-500 outline-none transition">
                    </div>

                    <div class="flex flex-col">
                        <label class="text-sm font-medium mb-1">Claim Amount Requested</label>
                        <input type="number" name="claim_amount" required class="border rounded-lg p-2.5 focus:ring-2 focus:ring-blue-500 outline-none transition">
                    </div>

                    <div class="flex flex-col">
                        <label class="text-sm font-medium mb-1">Annual Premium</label>
                        <input type="number" name="policy_annual_premium" required class="border rounded-lg p-2.5 focus:ring-2 focus:ring-blue-500 outline-none transition">
                    </div>

                    <div class="flex flex-col">
                        <label class="text-sm font-medium mb-1">Education Level</label>
                        <select name="insured_education_level" class="border rounded-lg p-2.5 bg-white focus:ring-2 focus:ring-blue-500 outline-none transition">
                            <option value="Select">Select Level</option>
                            <option value="JD">JD</option>
                            <option value="PhD">PhD</option>
                            <option value="Masters">Masters</option>
                            <option value="MD">MD</option>
                            <option value="Associate">Associate</option>
                            <option value="College">College</option>
                            <option value="High School">High School</option>
                        </select>
                    </div>

                    <div class="flex flex-col">
                        <label class="text-sm font-medium mb-1">Incident Severity</label>
                        <select name="incident_severity" class="border rounded-lg p-2.5 bg-white focus:ring-2 focus:ring-blue-500 outline-none transition">
                            <option value="Select">Select Level</option>
                            <option value="Minor Damage">Minor Damage</option>
                            <option value="Major Damage">Major Damage</option>
                            <option value="Total Loss">Total Loss</option>
                            <option value="Trivial Damage">Trivial Damage</option>
                        </select>
                    </div>
                </div>

                <div class="mt-10">
                    <button type="button" id="submitBtn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-6 rounded-xl shadow-lg transform active:scale-[0.98] transition">
                        Run Fraud Analysis
                    </button>
                </div>
            </form>

            <div id="resultContainer" class="mt-8"></div>
        </div>

        <footer class="mt-10 text-center text-slate-400 text-sm">
            &copy; 2026 FraudGuard AI Systems | Developed by Frank
        </footer>
    </div>

    <script>
        // ✅ Replace this with your actual Render backend URL
        const RENDER_URL = "https://YOUR-APP-NAME.onrender.com";

        document.getElementById('submitBtn').addEventListener('click', function () {
            const form = document.getElementById('fraudForm');
            const resultContainer = document.getElementById('resultContainer');
            const submitBtn = this;

            if (!form.checkValidity()) {
                form.reportValidity();
                return;
            }

            // Show loading
            submitBtn.innerText = "Analyzing Claim...";
            submitBtn.disabled = true;
            resultContainer.innerHTML = `
                <div class="flex justify-center">
                    <div class="loader ease-linear rounded-full border-4 border-t-4 border-gray-200 h-12 w-12"></div>
                </div>`;

            // ✅ Collect form as plain object and send as JSON (not FormData)
            const formData = new FormData(form);
            const data = Object.fromEntries(formData.entries());

            fetch(`${RENDER_URL}/predict`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(data)
            })
            .then(response => response.json())
            .then(json => {
                const result = json.result || json.error || "Unexpected response";
                const isFraud = result.includes('Fraud') && !result.includes('No');

                resultContainer.innerHTML = `
                    <div class="p-6 rounded-xl ${isFraud
                        ? 'bg-red-50 border border-red-200'
                        : 'bg-green-50 border border-green-200'} text-center">
                        <h3 class="text-lg font-semibold ${isFraud ? 'text-red-700' : 'text-green-700'}">
                            Prediction Result: ${result}
                        </h3>
                    </div>`;

                submitBtn.innerText = "Run Fraud Analysis";
                submitBtn.disabled = false;
            })
            .catch(error => {
                console.error('Error:', error);
                resultContainer.innerHTML = `
                    <p class="text-red-500 text-center">
                        Could not reach the server. Make sure the Render backend is live.
                    </p>`;
                submitBtn.innerText = "Run Fraud Analysis";
                submitBtn.disabled = false;
            });
        });
    </script>
</body>
</html>
